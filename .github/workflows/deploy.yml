name: Central infrastructure deployment

on:
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'modules/**'
      - 'scripts/deployment_plan.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  ARM_USE_CLI: 'false'
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: central-plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    outputs:
      fingerprint: ${{ steps.review.outputs.fingerprint }}
      changes: ${{ steps.review.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify deployment approval controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/central-apply" | jq -e '
            .can_admins_bypass == false and
            any(.protection_rules[];
              .type == "required_reviewers" and
              (.reviewers | length) == 1 and
              .reviewers[0].reviewer.login == "michaela-links")'
          for environment in central-plan central-apply; do
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment/deployment-branch-policies" | jq -e '
              (.branch_policies | length) == 1 and
              .branch_policies[0].name == "main" and
              .branch_policies[0].type == "branch"'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform -chdir=ci init -input=false -lockfile=readonly -backend-config=backend.hcl
      - name: Plan with read-only Azure permissions
        run: terraform -chdir=ci plan -input=false -lock=false -out="$RUNNER_TEMP/review.tfplan"
      - id: review
        run: python3 scripts/deployment_plan.py "$RUNNER_TEMP/review.tfplan"
      - name: Remove local plan
        if: always()
        run: rm -f "$RUNNER_TEMP/review.tfplan"

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: central-apply
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject a superseded deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform -chdir=ci init -input=false -lockfile=readonly -backend-config=backend.hcl
      - name: Re-plan after deployment approval
        run: terraform -chdir=ci plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/approved.tfplan"
      - name: Require the reviewed plan
        env:
          EXPECTED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
        run: python3 scripts/deployment_plan.py "$RUNNER_TEMP/approved.tfplan" --expected "$EXPECTED_FINGERPRINT"
      - name: Apply the verified saved plan
        run: terraform -chdir=ci apply -input=false -lock-timeout=5m "$RUNNER_TEMP/approved.tfplan"
      - name: Remove local plan
        if: always()
        run: rm -f "$RUNNER_TEMP/approved.tfplan"
